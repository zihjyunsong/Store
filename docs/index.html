<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>露米甜點 Lumière Pâtisserie</title>
  <meta name="description" content="留法女孩的明亮甜點小店。法式手藝，日常甜點。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
</head>
<body data-page="home">

  <!-- ── 頂部導覽列 ─────────────────── -->
  <header class="site-header">
    <div class="container site-header-inner">
      <a href="index.html" class="site-logo">
        <span class="logo-zh">露米甜點</span>
        <span class="logo-en">Lumière</span>
      </a>
      <div class="header-auth">
        <a href="login.html" class="auth-btn" id="auth-login-btn" title="登入" aria-label="登入">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </a>
        <div class="auth-user" id="auth-user" style="display:none">
          <img id="auth-avatar" src="" alt="" class="auth-avatar">
          <span id="auth-name" class="auth-name"></span>
          <button id="auth-logout-btn" class="auth-logout-btn">登出</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ── Hero ──────────────────────────────────────── -->
  <section class="hero">
    <div id="hero">
      <div class="hero-content">
        <div class="hero-name-en">Lumière Pâtisserie</div>
        <div class="hero-tagline">法式手藝，日常甜點。</div>
        <div class="hero-desc">台中女孩的明亮甜點小店。</div>
      </div>
    </div>
  </section>

  <!-- ── 甜點分類 ───────────────────────────────────── -->
  <section id="categories-section">
    <div class="container">
      <h2 class="section-title">甜點分類</h2>
      <div id="categories-grid" class="categories-grid">
        <p class="loading">載入中⋯</p>
      </div>
    </div>
  </section>

  <!-- ── 精選甜點 ───────────────────────────────────── -->
  <section id="featured-section" style="background: var(--almond);">
    <div class="container">
      <h2 class="section-title">精選甜點</h2>
      <div id="featured-grid" class="products-grid">
        <p class="loading">載入中⋯</p>
      </div>
    </div>
  </section>

  <!-- ── 認識店主 CTA ────────────────────────────────── -->
  <section class="owner-cta-section">
    <div class="container">
      <a href="owner.html" target="_blank" class="btn-primary">認識店主</a>
    </div>
  </section>

  <!-- ── 店面聯絡資訊 ───────────────────────────────── -->
  <section class="contact-section">
    <div class="container">
      <div id="contact-info">
        <p class="loading">載入中⋯</p>
      </div>
    </div>
  </section>

  <!-- ── 頁尾 ──────────────────────────────────────── -->
  <footer>
    <div class="footer-inner">
      <p id="footer-text" class="footer-text">今天也要吃點甜。</p>
      <p class="footer-copy">© 2026 露米甜點 Lumière Pâtisserie</p>
    </div>
  </footer>

  <script src="js/model.js"></script>
  <script src="js/view.js"></script>
  <script src="js/controller.js"></script>
</body>
</html>

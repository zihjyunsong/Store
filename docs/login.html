<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登入 — 露米甜點</title>
  <meta name="description" content="登入露米甜點會員，享受更多服務。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
</head>
<body data-page="login">

  <!-- ── 頂部導覽列 ─────────────────────────────────── -->
  <header class="site-header">
    <div class="container site-header-inner">
      <a href="index.html" class="site-logo">
        <span class="logo-zh">露米甜點</span>
        <span class="logo-en">Lumière</span>
      </a>
      <div class="header-auth">
        <a href="login.html" class="auth-btn" id="auth-login-btn" title="登入" aria-label="登入">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </a>
        <div class="auth-user" id="auth-user" style="display:none">
          <img id="auth-avatar" src="" alt="" class="auth-avatar">
          <span id="auth-name" class="auth-name"></span>
          <button id="auth-logout-btn" class="auth-logout-btn">登出</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ── 登入區 ────────────────────────────────────── -->
  <main class="login-page">
    <div class="login-card">
      <h1 class="login-title">歡迎回來</h1>
      <p class="login-subtitle">登入你的帳號，享受更多服務。</p>

      <p class="form-error" id="login-error" style="display:none"></p>

      <button class="google-btn" id="google-signin-btn">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.71-1.57 2.68-3.89 2.68-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
        </svg>
        <span>使用 Google 登入</span>
      </button>

      <p class="login-hint" id="login-success" style="display:none"></p>

      <p class="login-foot">
        <a href="index.html">← 回首頁</a>
      </p>
    </div>
  </main>

  <script>
    // 登入後導向：優先回上一頁，否則回首頁
    function redirectAfterLogin() {
      const params = new URLSearchParams(window.location.search);
      const from = params.get('from');
      if (from) {
        window.location.href = from;
      } else {
        window.location.href = 'index.html';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const btn       = document.getElementById('google-signin-btn');
      const errorEl   = document.getElementById('login-error');
      const successEl = document.getElementById('login-success');

      // 若已登入，顯示提示
      Auth.initFirebase();
      firebase.auth().onAuthStateChanged(user => {
        if (user) {
          successEl.textContent = `已登入：${user.displayName || user.email}`;
          successEl.style.display = 'block';
        }
      });

      btn.addEventListener('click', async () => {
        errorEl.style.display = 'none';
        btn.disabled = true;
        try {
          await Auth.signInWithGoogle();
          redirectAfterLogin();
        } catch (err) {
          console.error('[Login] Google 登入失敗：', err);
          errorEl.textContent = '登入失敗，請再試一次。';
          errorEl.style.display = 'block';
          btn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
